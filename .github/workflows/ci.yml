name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # firebase-admin 14 and its Google libraries require 22.
          node-version: "22"
          cache: "npm"
          # @favourwright/knomad-pay-client lives on GitHub Packages. This
          # writes an .npmrc that reads its token from NODE_AUTH_TOKEN.
          registry-url: "https://npm.pkg.github.com"
          scope: "@favourwright"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run typecheck

      # Security regressions, none of which need a credential or a network.
      - name: Security tests
        run: |
          npm run test:register-claims
          npm run test:router-address
          npm run test:router-credentials
          npm run test:safe-fetch
          npm run test:redirect

      # High and above. What is left is moderate, inside firebase-admin's Google
      # client libraries. The browser depends on @firebase/app and @firebase/auth
      # rather than the full firebase package, which is what cleared the highs.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      # Also runs scripts/check-client-bundle.mts through `postbuild`.
      - name: Build
        run: npm run build
