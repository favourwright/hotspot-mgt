# Reverse proxy for the Next.js app (systemd service: hotspot-mgt, port 3000).
#
# Listens on 8080, not 80 - this VPS already has Apache bound to port 80,
# serving other unrelated, still-needed sites (mikhmon, globlinksadmin).
# Those must never be touched by anything here.
#
# No domain yet, so this is plain HTTP for now. Once a domain exists and SSL
# is set up, this can be revisited (either move Next.js onto its own
# subdomain proxied by Apache, or give it a dedicated IP/port with its own
# cert - a decision for that point, not now).

server {
    listen 8080;
    server_name _;

    # Names the exact version in every response. Set this in the live HTTPS server
    # block too: this file is not what the VPS runs (see next.config.ts).
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
