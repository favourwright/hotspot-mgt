# Reverse proxy for the Next.js app (systemd service: hotspot-mgt, port 3000).
#
# No domain yet, so this listens on the bare IP over plain HTTP. Once a
# domain is pointed here, `certbot --nginx -d yourdomain.com` will rewrite
# this file to add a 443/SSL server block automatically — no manual edits
# needed at that point beyond re-running certbot.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
